<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width-device width, initial-scale=1.0">
    <title>My website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/PNG" href="Psyduck-Pokemon.PNG">
</head>
<body>
    <header>
    </header>
    <main>
        <div class="wheelwrap">
            <button id="buttonspin">Hold to spin</button>
            <div class="wheel">
                <div class="lines" style="--i:0"></div>
                <div class="lines" style="--i:1"></div>
                <div class="lines" style="--i:2"></div>
                <div class="lines" style="--i:3"></div>

                <label id="label1" class="labels" style="--x:0">1</label>
                <label id="label2" class="labels" style="--x:1">2</label>
                <label id="label3" class="labels" style="--x:2">3</label>
                <label id="label4" class="labels" style="--x:3">4</label>
                <label id="label5" class="labels" style="--x:4">5</label>
                <label id="label6" class="labels" style="--x:5">6</label>
                <label id="label7" class="labels" style="--x:6">7</label>
                <label id="label8" class="labels" style="--x:7">8</label>
            </div>
        </div>
    </main>
    <footer>
    </footer>
</body>
<script src="index.js"></script>
</html>
